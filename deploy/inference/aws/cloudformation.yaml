AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CAWbase content engine A09-1 inference host: one g6e.xlarge (NVIDIA L40S) with llama.cpp b12329 and
  Qwen3.6-27B Q8_0 (qwen3.6-27b-q8_0, all weights on the GPU) on a persistent EBS weights volume, private endpoint,
  server started at every boot, stopped (not terminated) when idle. GENERATED (do not edit) by build_template.py from cloudformation.template.yaml.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet of the GPU host. It needs outbound HTTPS at first boot (GitHub, Hugging Face, SSM).
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Must be the Availability Zone of SubnetId (the weights volume is zonal).
  AssignPublicIp:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      true only for a public subnet without NAT, to allow outbound downloads. The endpoint stays private either
      way: the security group admits port 8080 only from ClientSecurityGroupId / ClientCidr.
  ClientSecurityGroupId:
    Type: String
    Default: ""
    Description: Security group of the controller and workers allowed to reach the endpoint (preferred).
  ClientCidr:
    Type: String
    Default: ""
    Description: Alternative private CIDR allowed to reach the endpoint (e.g. 10.0.0.0/16). Leave empty if unused.
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Pinned AMI id. Resolve it once with: aws ssm get-parameter --name
      /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-24.04/latest/ami-id
  InstanceType:
    Type: String
    Default: g6e.xlarge
    Description: >-
      Validation target (pending): g6e.xlarge with qwen3.6-27b-q8_0. Another type must fit the whole model in
      VRAM (-ngl all --fit off): if it does not, the server fails explicitly.
  ServerProfile:
    Type: String
    Default: reference-8k-1slot
    AllowedValues: [reference-8k-1slot, candidate-16k-1slot, candidate-16k-2slot, candidate-32k-2slot]
  ApiKeyParameterName:
    Type: String
    Default: /cce/inference/api-key
    MaxLength: 256
    AllowedPattern: "^/[A-Za-z0-9_./-]+$"
    Description: Existing SSM SecureString (aws/ssm key) with the endpoint API key. Created by the operator.
  RootVolumeGiB:
    Type: Number
    Default: 80
    MinValue: 75
  WeightsVolumeGiB:
    Type: Number
    Default: 40
    MinValue: 30
    Description: >-
      Holds Qwen3.6-27B-Q8_0.gguf (26.63 GiB) and its temporary download (one copy at a time; an unverifiable
      file is removed first). Minimum generated from the manifest size.
  WeightsVolumeThroughput:
    Type: Number
    Default: 250
    MinValue: 125
    MaxValue: 1000
    Description: gp3 MiB/s of the weights volume (cold weight load time vs. monthly cost).
  HostPermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: >-
      Optional permissions boundary of the host role. The local validation (deploy/inference/validation) passes
      the boundary of its base stack, whose CloudFormation execution role can only create roles bounded by it.
      Empty (manual deployment): no boundary.
  WatchdogStart:
    Type: String
    Default: ""
    AllowedPattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)?$"
    Description: >-
      Optional AWS-side stop (local validation, deploy/inference/validation): from this UTC time an EventBridge
      schedule, created by CloudFormation with the instance (no local process involved), stops it every 10 min until
      WatchdogEnd. If the schedule cannot be created the stack rolls back and the instance is removed. Empty: none.
  WatchdogEnd:
    Type: String
    Default: ""
    AllowedPattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)?$"
  WatchdogRoleArn:
    Type: String
    Default: ""
    Description: Role EventBridge Scheduler uses to stop the instance (access stack of the GitHub validation).
  WatchdogScheduleGroup:
    Type: String
    Default: cce-inference-watchdog
  GuardIdleMinutes:
    Type: Number
    Default: 120
    MinValue: 90
    MaxValue: 1440
    Description: Instance-side backstop; must exceed the controller's 60-minute idle rule plus the readiness limit.

Conditions:
  HasClientSg: !Not [!Equals [!Ref ClientSecurityGroupId, ""]]
  HasClientCidr: !Not [!Equals [!Ref ClientCidr, ""]]
  HasHostBoundary: !Not [!Equals [!Ref HostPermissionsBoundaryArn, ""]]
  HasWatchdog: !Not [!Equals [!Ref WatchdogStart, ""]]

Resources:
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CCE inference endpoint (private; no SSH, access by SSM Session Manager)
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to GitHub, Hugging Face and AWS APIs
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Ubuntu package mirrors (libgomp1 at first boot if absent)
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-endpoint"}

  IngressFromClientSg:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasClientSg
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref ClientSecurityGroupId

  IngressFromClientCidr:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasClientCidr
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      CidrIp: !Ref ClientCidr

  HostRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If [HasHostBoundary, !Ref HostPermissionsBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-endpoint-api-key
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiKeyParameterName}"

  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]

  WeightsVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Size: !Ref WeightsVolumeGiB
      VolumeType: gp3
      Iops: 3000
      Throughput: !Ref WeightsVolumeThroughput
      Encrypted: true
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-weights"}

  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref HostProfile
      InstanceInitiatedShutdownBehavior: stop
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          AssociatePublicIpAddress: !Ref AssignPublicIp
          GroupSet: [!Ref EndpointSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-gpu"}
        - {Key: cce:role, Value: inference}
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euo pipefail
            mkdir -p /opt/cce-inference/src
            echo '${Bundle}' | base64 -d | tar -xz -C /opt/cce-inference/src
            /opt/cce-inference/src/aws/bootstrap.sh --volume-id ${WeightsVolume} --region ${AWS::Region} \
              --api-key-param ${ApiKeyParameterName} --model qwen3.6-27b-q8_0 --profile ${ServerProfile} \
              --guard-idle-min ${GuardIdleMinutes}
          - Bundle: 

  Watchdog:
    Type: AWS::Scheduler::Schedule
    Condition: HasWatchdog
    Properties:
      Name: !Sub "${AWS::StackName}-watchdog"
      GroupName: !Ref WatchdogScheduleGroup
      Description: Stops the validation instance after the job's time limit, independently of the runner
      ScheduleExpression: rate(10 minutes)
      ScheduleExpressionTimezone: UTC
      StartDate: !Ref WatchdogStart
      EndDate: !Ref WatchdogEnd
      FlexibleTimeWindow: {Mode: "OFF"}
      State: ENABLED
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !Ref WatchdogRoleArn
        Input: !Sub '{"InstanceIds": ["${Host}"]}'
        RetryPolicy: {MaximumRetryAttempts: 5, MaximumEventAgeInSeconds: 3600}

  WeightsAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Host
      VolumeId: !Ref WeightsVolume
      Device: /dev/sdf

  ControllerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Least privilege for the inference controller (outside the GPU host) to operate this instance.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StartStopThisInstance
            Effect: Allow
            Action: [ec2:StartInstances, ec2:StopInstances]
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Host}"
          - Sid: DescribeIsNotResourceScoped
            Effect: Allow
            Action: ec2:DescribeInstances
            Resource: "*"
          - Sid: ReadEndpointApiKey
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiKeyParameterName}"

Outputs:
  InstanceId:
    Value: !Ref Host
  EndpointUrl:
    Description: Private endpoint (stable across stop/start; the primary private IP does not change).
    Value: !Sub "http://${Host.PrivateIp}:8080"
  EndpointSecurityGroupId:
    Value: !Ref EndpointSecurityGroup
  WeightsVolumeId:
    Value: !Ref WeightsVolume
  ControllerPolicyArn:
    Value: !Ref ControllerPolicy
  WatchdogScheduleName:
    Condition: HasWatchdog
    Value: !Sub "${AWS::StackName}-watchdog"
