[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cawbase-content-engine"
dynamic = ["version"]
description = "Independent content-engine foundation: scopes, API keys, persistence and an optional HTTP adapter."
readme = "README.md"
requires-python = ">=3.13"
# License is pending (see docs/decisions/A01-decisions.md, Q-01). No license is declared on purpose.
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30,<1"]
sqlite = ["aiosqlite>=0.20,<1"]
migrations = ["alembic>=1.14,<2"]
http = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "alembic>=1.14,<2"]

[project.scripts]
cawbase-content-engine = "cawbase_content_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "build>=1.2",
    "asyncpg>=0.30,<1",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
]

[tool.hatch.version]
path = "src/cawbase_content_engine/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cawbase_content_engine"]

[tool.hatch.build.targets.sdist]
include = ["src/cawbase_content_engine", "tests", "docs", "examples", "README.md", "CLAUDE.md", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "UP046", "UP047", "ASYNC109", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S603", "S607", "S608", "E501", "ASYNC210", "ASYNC220", "B017", "E731"]
"scripts/*" = ["S603", "E501"]
"examples/*" = ["S105", "S106", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not dist'"
markers = [
    "spike: foundational technical verification tests",
    "dist: builds wheel/sdist and installs them into clean environments (slow, needs a package index)",
]
