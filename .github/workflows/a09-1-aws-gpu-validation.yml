# A09-1 validation on the real AWS target (g6e.xlarge, NVIDIA L40S, Qwen3.6-27B Q8_0, all weights on the GPU,
# private endpoint), triggered by MERGING a new versioned request into main. Contract and enablement:
# docs/a09-1-aws-validation-automation.md. NOT YET EXECUTED ON GITHUB: tested with simulated AWS only.
#
# - Runs only for a push to main that ADDS one deploy/inference/validation-requests/<id>.json (README changes,
#   modified or renamed requests never run). No pull_request trigger: a PR can never obtain AWS credentials (its OIDC
#   subject is `...:pull_request`, which the role does not trust).
# - Spends at most once per request id: the id is claimed atomically in SSM Parameter Store before anything is
#   created. Re-running the workflow (or re-adding the id) spends nothing and only re-verifies the cleanup.
# - One run at a time (concurrency group, no cancellation): the account's G/VT quota is 4 vCPU = one g6e.xlarge.
#   GitHub keeps only the newest pending run of a group; an older pending one is cancelled before it starts (nothing
#   claimed, nothing spent): re-run it when the current one ends.
# - The `cleanup` job always runs (failure, time limit, cancellation) with its own fresh credentials, and its status
#   is the cleanup's, separate from the validation's. An EventBridge schedule in AWS stops the instance after the
#   time limit even if no runner is left.
# - AWS credentials are temporary (OIDC, aws-actions/configure-aws-credentials); no AWS secret is stored in GitHub.
#
# Actions pinned to full commit SHAs (tag in the comment); configure-aws-credentials v6.3.0 checked with
# `git ls-remote --tags` on 2026-11-24; the others as in ci.yml.
name: a09-1-aws-gpu-validation

on:
  push:
    branches: [main]
    paths: ["deploy/inference/validation-requests/**"]

permissions:
  contents: read

concurrency:
  group: a09-1-aws-gpu-validation
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  UV_PYTHON: "3.13"

jobs:
  detect:
    name: detect the new request (no AWS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      request: ${{ steps.detect.outputs.request }}
      id: ${{ steps.detect.outputs.id }}
      stack: ${{ steps.detect.outputs.stack }}
      after_run: ${{ steps.detect.outputs.after_run }}
      timeout_minutes: ${{ steps.detect.outputs.timeout_minutes }}
      role_duration_seconds: ${{ steps.detect.outputs.role_duration_seconds }}
    steps:
      - name: Refuse anything but a push to main
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::only a push to refs/heads/main runs a validation (got $GITHUB_EVENT_NAME $GITHUB_REF)"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate every request offline (ids unique, schema, manifest target)
        run: python3 deploy/inference/ci/aws_validation.py check
      - name: Detect the request this push added
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 deploy/inference/ci/aws_validation.py detect --before "$BEFORE" --after "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  validate:
    name: validate ${{ needs.detect.outputs.id }} on AWS
    needs: detect
    if: needs.detect.outputs.request != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.detect.outputs.timeout_minutes || '60') }}
    permissions:
      contents: read
      id-token: write # OIDC for aws-actions/configure-aws-credentials; only this job and cleanup have it
    env:
      REQUEST: ${{ needs.detect.outputs.request }}
      REQUEST_ID: ${{ needs.detect.outputs.id }}
    steps:
      - name: Require the repository variable (before any credential is requested); paths outside the checkout
        env:
          ROLE: ${{ vars.CCE_A09_AWS_ROLE_ARN }}
        run: |
          [ -n "$ROLE" ] || { echo "::error::repository variable CCE_A09_AWS_ROLE_ARN is not set (initial enablement)"; exit 1; }
          { echo "EV=$RUNNER_TEMP/a09-evidence/$REQUEST_ID"; echo "WORK=$RUNNER_TEMP/a09-work"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner tools (recorded; the SSM tunnel needs session-manager-plugin)
        run: |
          mkdir -p "$EV"
          { aws --version; session-manager-plugin --version || echo "session-manager-plugin: MISSING"; python3 --version; } 2>&1 | tee "$EV/runner-tools.txt"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Controller environment (boto3 for the EC2 backend)
        run: uv sync --project deploy/inference/controller --extra aws --frozen
      - name: OIDC subject presented by this job (safe claims only, never the token)
        run: python3 deploy/inference/ci/aws_validation.py oidc-claims --out "$EV/oidc-claims.json"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CCE_A09_AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: ${{ fromJSON(needs.detect.outputs.role_duration_seconds || '5400') }}
          role-session-name: a09-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
      - name: Preflight, claim, step A (stack, watchdog, bootstrap), step B (gpu-validation.py), cleanup
        env:
          CCE_A09_ACCESS_STACK: ${{ vars.CCE_A09_ACCESS_STACK }}
        run: |
          python3 deploy/inference/ci/aws_validation.py run --request "$REQUEST" --evidence "$EV" \
            --workdir "$WORK" --python "$PWD/deploy/inference/controller/.venv/bin/python"
      - name: Remove secrets from the evidence (also after a failure or a timeout)
        if: always()
        run: python3 deploy/inference/ci/aws_validation.py redact "$EV" --secret-file "$WORK/secrets/api-key"
      - name: Summary
        if: always()
        run: python3 deploy/inference/ci/aws_validation.py summary "$EV" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a09-1-validation-${{ needs.detect.outputs.id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a09-evidence/${{ needs.detect.outputs.id }}
          if-no-files-found: warn
          retention-days: 90

  cleanup:
    name: cleanup ${{ needs.detect.outputs.id }} (${{ needs.detect.outputs.after_run }}) and its verification
    needs: [detect, validate]
    # always(): also after a failure, the job's time limit or a cancellation of the workflow
    if: always() && needs.detect.outputs.request != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      REQUEST: ${{ needs.detect.outputs.request }}
      REQUEST_ID: ${{ needs.detect.outputs.id }}
    steps:
      - name: Require the repository variable; evidence path outside the checkout
        env:
          ROLE: ${{ vars.CCE_A09_AWS_ROLE_ARN }}
        run: |
          [ -n "$ROLE" ] || { echo "::error::repository variable CCE_A09_AWS_ROLE_ARN is not set"; exit 1; }
          echo "EV=$RUNNER_TEMP/a09-cleanup/$REQUEST_ID" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CCE_A09_AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 7200
          role-session-name: a09-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
      - name: Stop and verify; delete and verify when the request says delete (idempotent)
        env:
          CCE_A09_ACCESS_STACK: ${{ vars.CCE_A09_ACCESS_STACK }}
        run: python3 deploy/inference/ci/aws_validation.py cleanup --request "$REQUEST" --evidence "$EV"
      - name: Summary (the validation result is the validate job's)
        if: always()
        run: |
          echo "validate job: ${{ needs.validate.result }}" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 deploy/inference/ci/aws_validation.py summary "$EV" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a09-1-cleanup-${{ needs.detect.outputs.id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a09-cleanup/${{ needs.detect.outputs.id }}
          if-no-files-found: warn
          retention-days: 90
