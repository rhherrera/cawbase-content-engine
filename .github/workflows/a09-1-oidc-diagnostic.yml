# OIDC diagnostic for the A09-1 validation role: OBSERVES the real `sub` (and a few other claims) that GitHub issues
# for this repository's main branch, so that deploy/inference/aws/github-validation-access.yaml trusts exactly that
# value (parameter GitHubSubject). The format cannot be assumed: name-based (`repo:OWNER/REPO:ref:refs/heads/main`)
# or immutable-ID (`repo:OWNER@ID/REPO@ID:ref:...`) depending on the repository, or a custom template.
#
# Runs on main only: when this file reaches main (push) and on demand (workflow_dispatch). It requests a token with
# aud=sts.amazonaws.com, decodes its payload in memory and prints ONLY sub, aud, ref, repository, repository_id,
# repository_owner_id and job_workflow_ref. It never prints the token, never assumes a role, never calls AWS and has
# no AWS credential. With the default subject template, a push and a workflow_dispatch on main present the same sub.
name: a09-1-oidc-diagnostic

on:
  push:
    branches: [main]
    paths: [".github/workflows/a09-1-oidc-diagnostic.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: a09-1-oidc-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # the token is requested only to read its claims; no AWS call is made
    steps:
      - name: Refuse anything but main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run it on main: the claims of another ref are not the ones the role must trust"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Print the safe claims (copy `sub` verbatim into GitHubSubject)
        run: python3 deploy/inference/ci/aws_validation.py oidc-claims
